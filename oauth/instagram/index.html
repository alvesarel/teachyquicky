<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting…</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<main>
<h1>Connecting…</h1>
<p>Handing the Facebook sign-in back to the uploader running on this computer.</p>
<p id="manual" hidden>If nothing happens, make sure the connect command is still running on this computer, then <a id="link" href="#">continue here</a>.</p>
</main>
<script>
  // Meta only accepts https redirect URIs for Live apps. Facebook sends the browser here with
  // ?code=…&state=…, and this page forwards them to the local listener started by
  // `npx tsx pipeline/publish-instagram.ts --channel <slug> auth` (motionyt).
  var target = "http://localhost:8766/instagram/" + location.search + location.hash;
  document.getElementById("link").href = target;
  document.getElementById("manual").hidden = false;
  location.replace(target);
</script>
</body>
</html>
